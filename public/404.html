<!DOCTYPE html>
<html lang="ja">
<head>
  <title>ページが見つかりません | まかせてカロごはん</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/icon.png" type="image/png">
  <!--
    静的エラーページのため Tailwind（アセットパイプライン）は使えない。
    そのためアプリの配色をインラインCSSで再現している。
    画像も /assets 配下は参照できないので public/tomato_character.png を使う。
  -->
  <style>
    body {
      background-color: #FFFEF5; /* アプリ共通の背景色 */
      color: #3a3820;
      font-family: ui-sans-serif, system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 24rem; /* トップページの max-w-sm に合わせる */
      padding: 1.25rem;
      text-align: center;
    }

    .status-code {
      font-size: 64px;
      font-weight: 700;
      color: #f97316; /* トップページ見出しのオレンジ */
      line-height: 1;
      margin: 0;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #2a2810;
      margin: 12px 0 0;
    }

    .character {
      width: 112px;
      height: 112px;
      margin-top: 12px;
    }

    .description {
      font-size: 13px;
      color: #7a7550;
      line-height: 1.7;
      margin: 12px 0 0;
    }

    /* アプリ共通の主役ボタン（primary_button_classes）を再現 */
    .primary-button {
      display: block;
      background-color: #F9C639;
      color: #3a3820;
      text-align: center;
      padding: 0.875rem 0;
      border-radius: 0.5rem;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 16px;
      transition: all 0.15s;
    }

    .primary-button:hover {
      background-color: #EAB52C;
    }

    .primary-button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>
  <div class="container">
    <p class="status-code">404</p>
    <h1 class="title">ページが見つかりません</h1>
    <img src="/tomato_character.png" alt="" class="character">
    <p class="description">
      お探しのページは見つかりませんでした。<br>
      URLが変更されたか、削除された可能性があります。
    </p>
    <a href="/" class="primary-button">トップへ戻る</a>
  </div>
</body>
</html>
