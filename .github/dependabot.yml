version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "10:00"
    timezone: "Asia/Tokyo"
  open-pull-requests-limit: 10
  groups:
    # patchは自動マージ対象として別PRにまとめる
    patch:
      update-types:
      - patch
    # minorは人が確認するPR
    minor:
      update-types:
      - minor
      # railsは動作確認が必要なため、グループに混ぜず単独PRにする
      exclude-patterns:
      - rails
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 10
